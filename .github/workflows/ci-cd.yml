name: frontend-ci-cd

# feature/* -> develop PR 시 검증, develop merge 시 배포까지 수행한다.
# staging/main 배포는 develop 파이프라인 검증 후 별도로 확장한다.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# 같은 브랜치에 커밋이 연달아 올라오면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한만 부여한다. PR 실행은 Docker Hub 자격증명을 사용하지 않는다.
permissions:
  contents: read

env:
  IMAGE_NAME: gamehouse-frontend

jobs:
  # ---------------------------------------------------------------
  # [PR 게이트 1] Secret scan
  # 빌드 검증은 image-check의 docker build(npm ci && npm run build)가
  # 이미 수행하므로 여기서는 중복이라 제외했다.
  # lint/test를 도입하면 이 job에 npm run lint / npm test 를 추가한다.
  # secret scan은 이곳이 유일한 자리이므로 반드시 유지한다.
  # ---------------------------------------------------------------
  verify:
    name: verify (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # SAST: 토큰/비밀번호가 코드에 섞여 들어갔는지 검사한다.
      # merge 후에는 git 히스토리에 남아 되돌리기 어려우므로 반드시 PR 시점에 돌린다.
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose

  # ---------------------------------------------------------------
  # [PR 게이트 2] 이미지 빌드 & 기동 검증
  # Dockerfile이 vite build(정적 산출물) -> nginx 서빙 구조이므로,
  # 빌드가 깨지거나 nginx.conf 문법이 틀리면 여기서 잡힌다.
  # verify와 병렬로 실행되어 전체 대기 시간을 늘리지 않는다.
  # ---------------------------------------------------------------
  image-check:
    name: image-check (build & smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Dockerfile이 BuildKit 문법을 쓰고, type=gha 캐시를 쓰려면 필요하다.
      - uses: docker/setup-buildx-action@v3

      # push 없이 runner의 Docker에만 적재(load)한다.
      # 검증에 실패하면 Docker Hub에는 아무것도 올라가지 않는다.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 실제로 컨테이너를 띄워 nginx가 기동하고 SPA가 응답하는지 확인한다.
      #
      # nginx.conf의 `upstream { server backend:8080; }`는 nginx가 기동 시점에
      # resolve하므로, backend 호스트가 없으면 컨테이너가 아예 뜨지 않는다.
      # CI에는 backend 컨테이너가 없으므로 --add-host로 이름만 뚫어준다.
      # GET / 은 정적 index.html을 반환하므로 백엔드 없이도 200이 나온다.
      # (/api 프록시 자체는 배포 후 compose 네트워크에서 검증한다.)
      - name: Smoke test running container
        run: |
          docker run -d --name gh-frontend-ci \
            -p 8080:80 \
            --add-host backend:127.0.0.1 \
            ${{ env.IMAGE_NAME }}:ci

          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || echo 000)
            if [ "${code}" = "200" ]; then
              echo "HTTP 200 - nginx is up and serving the SPA"
              ok=1
              break
            fi
            echo "waiting... (attempt ${i}, last code=${code})"
            sleep 2
          done

          if [ "${ok}" != "1" ]; then
            echo "::error::Frontend did not return HTTP 200 within 60s"
            docker logs --tail=200 gh-frontend-ci
            exit 1
          fi

      - name: Clean up container
        if: always()
        run: docker rm -f gh-frontend-ci || true

  # ---------------------------------------------------------------
  # [배포] develop merge 이후에만 실행
  # 위 두 게이트를 모두 통과한 커밋만 Docker Hub로 나간다.
  # image-check가 캐시를 채워두므로 여기서의 build는 대부분 캐시 히트다.
  # ---------------------------------------------------------------
  publish:
    name: publish (push to Docker Hub)
    needs: [verify, image-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 배포 대상은 x86 서버 기준이므로 단일 arch로 빌드한다.
      # ARM 서버로 옮기게 되면 platforms에 linux/arm64를 추가한다.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show pull command
        run: |
          echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:develop"
          echo "docker run -d -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:develop"
