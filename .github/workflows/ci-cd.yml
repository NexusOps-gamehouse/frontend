name: frontend-ci-cd

# ---------------------------------------------------------------
# Branch 운영
#
# feature/* -> develop PR
#   → secret scan + build/smoke test
#
# develop push
#   → 검증
#   → Docker Hub frontend-develop 이미지 publish
#
# develop -> main PR
#   → secret scan + build/smoke test
#
# main push
#   → 검증
#   → Vite production build
#   → Main Frontend S3 배포
#   → CloudFront cache invalidation
#
# Dev와 Main의 Frontend 배포 방식은 다르게 운영한다.
#
# Dev  : Docker image
# Main : S3 + CloudFront
# ---------------------------------------------------------------
on:
  pull_request:
    branches: [develop, main]
    paths-ignore: ['**.md']

  push:
    branches: [develop, main]
    paths-ignore: ['**.md']


# ---------------------------------------------------------------
# 같은 브랜치에 커밋이 연달아 올라오면
# PR 검증만 이전 실행을 취소한다.
#
# push는 실제 publish/deploy가 포함될 수 있으므로 취소하지 않는다.
# ---------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


# ---------------------------------------------------------------
# 기본 권한
#
# AWS OIDC가 필요한 Main deploy job에서만
# id-token: write를 별도로 부여한다.
# ---------------------------------------------------------------
permissions:
  contents: read


env:
  # Dev Docker image 설정
  IMAGE_REPO: gamehouse
  APP: frontend


jobs:

  # ---------------------------------------------------------------
  # [공통 검증 1] Secret scan
  #
  # develop/main PR 및 push 모두 수행한다.
  # ---------------------------------------------------------------
  verify:
    name: verify (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --no-git --redact --verbose


  # ---------------------------------------------------------------
  # [공통 검증 2] 이미지 빌드 & 기동 검증
  #
  # Dockerfile을 이용해 실제 Frontend image를 빌드하고
  # SPA가 정상적으로 기동되는지 확인한다.
  #
  # Main은 최종적으로 Docker image를 배포하지 않지만,
  # 동일한 애플리케이션 코드의 build 검증 단계로 활용한다.
  # ---------------------------------------------------------------
  image-check:
    name: image-check (build & smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.APP }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test running container
        run: |
          docker run -d --name gh-frontend-ci \
            -p 8080:5173 \
            ${{ env.APP }}:ci

          ok=0

          for i in $(seq 1 30); do

            body=$(curl -s -w '\n%{http_code}' http://localhost:8080/ || echo -e '\n000')
            code=$(echo "${body}" | tail -n1)

            if [ "${code}" = "200" ] && echo "${body}" | grep -q '<div id="root">'; then
              echo "HTTP 200 + SPA root found - serve is serving the built app"
              ok=1
              break
            fi

            echo "waiting... (attempt ${i}, last code=${code})"
            sleep 2

          done

          if [ "${ok}" != "1" ]; then

            echo "::error::Frontend did not serve a valid SPA (HTTP 200 + #root) within 60s"

            docker logs --tail=200 gh-frontend-ci

            exit 1

          fi

      - name: Clean up container
        if: always()
        run: docker rm -f gh-frontend-ci || true


  # ---------------------------------------------------------------
  # [Dev 배포 1] Docker Hub publish
  #
  # develop push에서만 실행한다.
  #
  # main push에서는 실행하지 않는다.
  # Main Frontend는 S3 + CloudFront 방식으로 배포한다.
  # ---------------------------------------------------------------
  publish:
    name: publish develop (Docker Hub)
    needs: [verify, image-check]

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push develop image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:${{ env.APP }}-develop
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO }}:${{ env.APP }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ---------------------------------------------------------------
  # [Dev 배포 2] EC2 deploy
  #
  # 현재 비활성 상태를 유지한다.
  #
  # 기존 Dev EC2 배포 구조를 다시 사용할 경우를 위해
  # 코드는 보존한다.
  # ---------------------------------------------------------------
  deploy:
    name: deploy develop (비활성)
    needs: publish

    if: false

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Encode ENV_FILE
        run: |
          printf "%s" "${{ secrets.ENV_FILE }}" | base64 -w0 > env.b64

      - name: Deploy via SSM
        run: |
          ENV_B64=$(cat env.b64)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy GameHouse Frontend Develop" \
            --parameters "commands=[
              \"echo '$ENV_B64' | base64 -d > /home/ssm-user/infra/.env\",
              \"sudo chown ssm-user:ssm-user /home/ssm-user/infra/.env\",
              \"sudo -u ssm-user -H bash /home/ssm-user/infra/scripts/deploy.sh\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text)

            echo "Current Status: $STATUS"

            case "$STATUS" in

              Success)
                echo "Deployment succeeded!"
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "::error::Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

                exit 1
                ;;

            esac

            sleep 5

          done

          echo "::error::Deployment timed out."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          exit 1


  # ---------------------------------------------------------------
  # [Main 배포] S3 + CloudFront
  #
  # main push에서만 실행한다.
  #
  # verify + image-check
  #       ↓
  # npm production build
  #       ↓
  # GitHub OIDC
  #       ↓
  # Main Frontend S3 sync
  #       ↓
  # CloudFront invalidation
  #
  # Main Frontend는 EC2/Docker를 사용하지 않는다.
  # ---------------------------------------------------------------
  deploy-main:
    name: deploy main (S3 + CloudFront)

    needs: [verify, image-check]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------
      # Vite production build
      # -----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # -----------------------------------------------------------
      # GitHub OIDC → Main AWS IAM Role
      # -----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # -----------------------------------------------------------
      # Vite build 결과를 Main Frontend S3에 배포한다.
      #
      # --delete:
      # 이전 build에서만 존재하던 오래된 hashed asset을 제거한다.
      # -----------------------------------------------------------
      - name: Deploy frontend to S3
        run: |
          aws s3 sync dist/ \
            "s3://${{ secrets.AWS_MAIN_FRONTEND_BUCKET }}/" \
            --delete

      # -----------------------------------------------------------
      # CloudFront cache invalidation
      #
      # 새로운 index.html 및 asset을 즉시 서비스하도록
      # 배포 완료 후 전체 경로를 무효화한다.
      # -----------------------------------------------------------
      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_MAIN_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "CloudFront invalidation created: ${INVALIDATION_ID}"